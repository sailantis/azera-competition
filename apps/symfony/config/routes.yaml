# Benchmark routes — parity with the azera app (same paths, same methods,
# ~100 filler routes so the route table size matches the other frameworks).

echo:
    path: /echo
    controller: App\Symfony\Controller\BenchController::echo
    methods: GET

home:
    path: /
    controller: App\Symfony\Controller\BenchController::index
    methods: GET

# --- ORM endpoints ---------------------------------------------------------
items_list:
    path: /items
    controller: App\Symfony\Controller\BenchController::list
    methods: GET
# GET /items with Doctrine hydration off: the single-variable control for
# /items (see BenchController::listFast()).
items_list_fast:
    path: /items-fast
    controller: App\Symfony\Controller\BenchController::listFast
    methods: GET
items_show:
    path: /items/{id}
    controller: App\Symfony\Controller\BenchController::show
    requirements:
        id: '\d+'
    methods: GET
items_create:
    path: /items
    controller: App\Symfony\Controller\BenchController::create
    methods: POST

# --- Query builder endpoints (no ORM hydration) ----------------------------
items_qb_list:
    path: /items-qb
    controller: App\Symfony\Controller\BenchController::listQb
    methods: GET
items_qb_show:
    path: /items-qb/{id}
    controller: App\Symfony\Controller\BenchController::showQb
    requirements:
        id: '\d+'
    methods: GET
items_qb_create:
    path: /items-qb
    controller: App\Symfony\Controller\BenchController::createQb
    methods: POST

# --- REST API ---------------------------------------------------------------
# Routing cost with a typed parameter and no ORM: the only endpoint whose
# measured time is route matching. See BenchController::routing().
#
# NOT registered at `/routing/{id}` as well. It once was, and that second path was
# measured by nothing: the harness asks only for `GET /api/routing/1`
# (BenchmarkConfig::featureMap()), so the duplicate was dead surface that made
# Symfony the only entrant advertising a route nobody timed — and, because the
# docblocks named `/routing/{id}`, it made the unprefixed path look like the
# benchmark's canonical one while six of seven apps serve only `/api/...`.
api_routing:
    path: /api/routing/{id}
    controller: App\Symfony\Controller\BenchController::routing
    methods: GET
    requirements:
        id: \d+

api_items_index:
    path: /api/items
    controller: App\Symfony\Controller\ApiController::index
    methods: GET
# Declared before api_items_show: the {id} route requires \d+, but keeping
# the literal first makes the precedence explicit rather than incidental.
api_items_fast:
    path: /api/items-fast
    controller: App\Symfony\Controller\ApiController::indexFast
    methods: GET
api_items_show:
    path: /api/items/{id}
    controller: App\Symfony\Controller\ApiController::show
    requirements:
        id: '\d+'
    methods: GET
api_items_create:
    path: /api/items
    controller: App\Symfony\Controller\ApiController::create
    methods: POST

# --- Feature demo endpoints -------------------------------------------------
features_index:
    path: /features
    controller: App\Symfony\Controller\FeatureController::index
    methods: GET
feature_aop_direct:
    path: /features/aop-tx-direct
    controller: App\Symfony\Controller\FeatureController::aopDirect
    methods: GET
feature_aop_cache_direct:
    path: /features/aop-cache-direct
    controller: App\Symfony\Controller\FeatureController::aopCacheDirect
    methods: GET
feature_log:
    path: /features/log
    controller: App\Symfony\Controller\FeatureController::log
    methods: GET
feature_events:
    path: /features/events
    controller: App\Symfony\Controller\FeatureController::events
    methods: GET
feature_validation:
    path: /features/validation
    controller: App\Symfony\Controller\FeatureController::validation
    methods: GET
feature_config:
    path: /features/config
    controller: App\Symfony\Controller\FeatureController::config
    methods: GET
feature_db_events:
    path: /features/db-events
    controller: App\Symfony\Controller\FeatureController::dbEvents
    methods: GET
feature_rate_limit:
    path: /features/rate-limit
    controller: App\Symfony\Controller\FeatureController::rateLimit
    methods: GET
# The lifecycle row. The hook is a kernel.response listener registered in
# services.yaml; the route name is what the listener matches on, so the two must agree.
feature_lifecycle_hooks:
    path: /features/lifecycle-hooks
    controller: App\Symfony\Controller\FeatureController::lifecycleHooks
    methods: GET

# --- Filler routes (route-table size parity with the other apps) -----------
filler:
    resource: ../src/Routing/filler_routes.php
