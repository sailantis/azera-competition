# Benchmark routes — parity with the azera app (same paths, same methods,
# ~100 filler routes so the route table size matches the other frameworks).

echo:
    path: /echo
    controller: App\Symfony\Controller\BenchController::echo
    methods: GET

# Routing cost with a typed parameter and no ORM: the only endpoint whose
# measured time is route matching. See BenchController::routing().
routing:
    path: /routing/{id}
    controller: App\Symfony\Controller\BenchController::routing
    methods: GET
    requirements:
        id: \d+

home:
    path: /
    controller: App\Symfony\Controller\BenchController::index
    methods: GET

# --- ORM endpoints ---------------------------------------------------------
items_list:
    path: /items
    controller: App\Symfony\Controller\BenchController::list
    methods: GET
# GET /items with Doctrine hydration off: the single-variable control for
# /items (see BenchController::listFast()).
items_list_fast:
    path: /items-fast
    controller: App\Symfony\Controller\BenchController::listFast
    methods: GET
items_show:
    path: /items/{id}
    controller: App\Symfony\Controller\BenchController::show
    requirements:
        id: '\d+'
    methods: GET
items_create:
    path: /items
    controller: App\Symfony\Controller\BenchController::create
    methods: POST

# --- Query builder endpoints (no ORM hydration) ----------------------------
items_qb_list:
    path: /items-qb
    controller: App\Symfony\Controller\BenchController::listQb
    methods: GET
items_qb_show:
    path: /items-qb/{id}
    controller: App\Symfony\Controller\BenchController::showQb
    requirements:
        id: '\d+'
    methods: GET
items_qb_create:
    path: /items-qb
    controller: App\Symfony\Controller\BenchController::createQb
    methods: POST

# --- REST API ---------------------------------------------------------------
# Routing cost in the deep 'api' bucket with a constant handler and no ORM: the
# only endpoint whose measured time is route matching. Declared before
# api_items_show so the literal segment is not swallowed by the {id} requirement.
# See BenchController::routing().
api_routing:
    path: /api/routing/{id}
    controller: App\Symfony\Controller\BenchController::routing
    methods: GET
    requirements:
        id: \d+

api_items_index:
    path: /api/items
    controller: App\Symfony\Controller\ApiController::index
    methods: GET
# Declared before api_items_show: the {id} route requires \d+, but keeping
# the literal first makes the precedence explicit rather than incidental.
api_items_fast:
    path: /api/items-fast
    controller: App\Symfony\Controller\ApiController::indexFast
    methods: GET
api_items_show:
    path: /api/items/{id}
    controller: App\Symfony\Controller\ApiController::show
    requirements:
        id: '\d+'
    methods: GET
api_items_create:
    path: /api/items
    controller: App\Symfony\Controller\ApiController::create
    methods: POST

