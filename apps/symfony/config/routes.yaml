    controller: App\Symfony\Controller\FeatureController::cache
    methods: GET
feature_log:
    path: /features/log
    controller: App\Symfony\Controller\FeatureController::log
    methods: GET
feature_retry:
    path: /features/retry
    controller: App\Symfony\Controller\FeatureController::retry
    methods: GET
feature_pipeline:
    path: /features/pipeline
    controller: App\Symfony\Controller\FeatureController::pipeline
    methods: GET
feature_events:
    path: /features/events
    controller: App\Symfony\Controller\FeatureController::events
    methods: GET
feature_validation:
    path: /features/validation
    controller: App\Symfony\Controller\FeatureController::validation
    methods: GET
feature_config:
    path: /features/config
    controller: App\Symfony\Controller\FeatureController::config
