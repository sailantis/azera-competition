# Benchmark routes — parity with the azera app (same paths, same methods,
# ~100 filler routes so the route table size matches the other frameworks).

home:
    path: /
    controller: App\Symfony\Controller\BenchController::index
    methods: GET

# --- ORM endpoints ---------------------------------------------------------
items_list:
    path: /items
    controller: App\Symfony\Controller\BenchController::list
    methods: GET
items_show:
    path: /items/{id}
    controller: App\Symfony\Controller\BenchController::show
    requirements:
        id: '\d+'
    methods: GET
items_create:
    path: /items
    controller: App\Symfony\Controller\BenchController::create
    methods: POST

# --- Query builder endpoints (no ORM hydration) ----------------------------
items_qb_list:
    path: /items-qb
    controller: App\Symfony\Controller\BenchController::listQb
    methods: GET
items_qb_show:
    path: /items-qb/{id}
    controller: App\Symfony\Controller\BenchController::showQb
    requirements:
        id: '\d+'
    methods: GET
items_qb_create:
    path: /items-qb
    controller: App\Symfony\Controller\BenchController::createQb
    methods: POST

# --- REST API ---------------------------------------------------------------
api_items_index:
    path: /api/items
    controller: App\Symfony\Controller\ApiController::index
    methods: GET
api_items_show:
    path: /api/items/{id}
    controller: App\Symfony\Controller\ApiController::show
    requirements:
        id: '\d+'
    methods: GET
api_items_create:
    path: /api/items
    controller: App\Symfony\Controller\ApiController::create
    methods: POST

