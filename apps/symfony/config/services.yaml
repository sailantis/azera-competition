parameters:
    benchmark.name: 'Azera Competition (Symfony)'
    benchmark.version: '1.0.0'
    benchmark.pageSize: 20

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Symfony\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Symfony\Service\:
        resource: '../src/Service/'

    # Request-scoped state: scoped services — a fresh instance per request,
    # single instance within the request (mirrors Spiral's #[Scope('http')]
    # and Laravel's $app->scoped()).
    App\Symfony\Service\RequestCounter:
        tags:
            - { name: kernel.reset, method: resetState }
    App\Symfony\Service\ScopeState:
        tags:
            - { name: kernel.reset, method: resetState }

    # DB event log: one entry per executed query. It records into
    # PROCESS-lifetime service state, so in a resident worker it grows without
    # bound (measured +~1.1 KB per query-request over 5,000 requests,
    # 2026-09-14) unless cleared per request — hence the same kernel.reset
    # hook the other request-scoped services carry (services_resetter is fired
    # by Kernel::terminate, which SymfonyAdapter::cleanup() calls).
    App\Symfony\Service\DbEventLog:
        tags:
            - { name: kernel.reset, method: clear }

    # DBAL driver middleware — records query + transaction activity into
    # DbEventLog (the db-events feature race).
    App\Symfony\Service\DbEventLoggerMiddleware:
        tags:
            - { name: doctrine.middleware }

    # Event listener for ItemCreated (PSR-14 / Symfony EventDispatcher).
    App\Symfony\EventListener\StampListener:
        tags:
            - { name: kernel.event_listener, event: App\Symfony\Event\ItemCreated, method: __invoke }
